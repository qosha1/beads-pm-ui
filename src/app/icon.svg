<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0a0a0a"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#grad1)" stroke-width="1.5"/>

  <!-- Connection lines -->
  <line x1="8" y1="10" x2="16" y2="16" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="24" y2="12" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="12" y2="22" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="22" y2="22" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>

  <!-- Beads (nodes) -->
  <circle cx="8" cy="10" r="3.5" fill="url(#grad1)"/>
  <circle cx="24" cy="12" r="3" fill="url(#grad2)"/>
  <circle cx="12" cy="22" r="2.5" fill="#eab308"/>
  <circle cx="22" cy="22" r="2.5" fill="#22c55e"/>

  <!-- Center bead -->
  <circle cx="16" cy="16" r="4" fill="url(#grad1)"/>
  <circle cx="16" cy="16" r="2" fill="#fff" opacity="0.9"/>
</svg>
