<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- Connection lines -->
  <line x1="45" y1="56" x2="90" y2="90" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="135" y2="68" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="68" y2="124" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="124" y2="124" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>

  <!-- Beads (nodes) -->
  <circle cx="45" cy="56" r="18" fill="url(#accent1)"/>
  <circle cx="135" cy="68" r="15" fill="url(#accent2)"/>
  <circle cx="68" cy="124" r="13" fill="#eab308"/>
  <circle cx="124" cy="124" r="13" fill="#22c55e"/>

  <!-- Center bead -->
  <circle cx="90" cy="90" r="22" fill="url(#accent1)"/>
  <circle cx="90" cy="90" r="11" fill="#fff" opacity="0.9"/>
</svg>
